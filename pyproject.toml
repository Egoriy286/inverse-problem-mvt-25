[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inverse-problems"
version = "0.1.0"
description = "Numerical methods and experiments for inverse problems in mathematical physics"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
